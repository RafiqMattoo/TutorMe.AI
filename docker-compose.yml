version: '3.9'

services:
  postgres:
    # pgvector/pgvector ships pgvector preinstalled — required by the RAG/Tutor flow.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vidyaai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vidyaai123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vidyaai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=vidyaai;Username=postgres;Password=vidyaai123
      - Jwt__Key=VidyaAI_SuperSecret_JWT_Key_2026_MinLength32Chars!
      - Jwt__Issuer=VidyaAI
      - Jwt__Audience=VidyaAIAdmin
      - AllowedOrigins__Frontend=http://localhost:5173
    depends_on:
      - postgres

volumes:
  pgdata:
